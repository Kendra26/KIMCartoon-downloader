version: 2.1

jobs:
  download_and_upload:
    docker:
      - image: cimg/node:18.17
    environment:
      TORRENT_MAGNET: "magnet:?xt=urn:btih:8F86D38E13D6D295477E3EBF05494A030333637A&dn=Ke+X.+Space-Time+Coding+Theory+in+Optical+Wireless+MIMO+Systems+2025&tr=udp://tracker.bittor.pw:1337/announce&tr=udp://tracker.opentrackr.org:1337/announce&tr=udp://tracker.dler.org:6969/announce&tr=udp://open.stealth.si:80/announce&tr=udp://tracker.torrent.eu.org:451/announce&tr=udp://exodus.desync.com:6969/announce&tr=udp://open.demonii.com:1337/announce"
      PIXELDRAIN_API_KEY: "8ec6f000-e8d1-403d-820b-4324a6a68869"
    steps:
      - checkout
      - run:
          name: Download file
          command: |
            mkdir -p downloads
            curl -s https://klipit.in/ugq73679 | grep -oP 'http[s]?://[^"'\'' >]+?\.(mp4|mkv|rar|zip)' > download_links.txt
      - run:
          name: Download media files
          command: |
            cat download_links.txt | xargs -n 1 -P 4 wget --content-disposition --no-check-certificate -P downloads
      - run:
          name: Rename files with debug
          command: |
            shopt -s nocasematch
            find ./downloads -type f -print0 | while IFS= read -r -d '' f; do
              filename=$(basename "$f")
              echo "Processing file: $filename"
              ext="${filename##*.}"
              base="${filename%.*}"
              echo "Extension: $ext, Base: $base"

              # Replace 'T.W' with 'Teen.Wolf'
              base="${base//T.W/Teen.Wolf}"
              echo "After replacing 'T.W' with 'Teen.Wolf': $base"

              # Replace dots with spaces in the base filename
              newbase="${base//./ }"
              echo "New base after replacing dots with spaces: '$newbase'"

              # Construct new filename with original extension
              newname="${f%/*}/$newbase.$ext"
              echo "Intended new filename: $newname"

              # Only rename if filename differs
              if [ "$filename" != "$newbase.$ext" ]; then
                echo "Renaming '$filename' to '$newbase.$ext'"
                mv "$f" "$newname"
              else
                echo "No renaming needed for: $filename"
              fi
            done
      - run:
          name: Upload files to PixelDrain
          command: |
            find ./downloads -type f -print0 | while IFS= read -r -d '' file; do
              echo "Uploading: $file"
              curl -g -X POST "https://upload.gofile.io/uploadfile" \
                -H "Authorization: Bearer 4RNhaDc7SmVZjOSG6PFAEghBaVu8il3V" \
                -F "file=@\"$file\"" \
                -F "folderId=15079133-5c66-4789-bde1-64b3675f8680"
            done

workflows:
  version: 2
  download_and_upload_workflow:
    jobs:
      - download_and_upload
