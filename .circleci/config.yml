version: 2.1

jobs:
  download_and_upload:
    docker:
      - image: cimg/node:18.17
    environment:
      TORRENT_MAGNET: "magnet:?xt=urn:btih:8F86D38E13D6D295477E3EBF05494A030333637A&dn=Ke+X.+Space-Time+Coding+Theory+in+Optical+Wireless+MIMO+Systems+2025&tr=udp://tracker.bittor.pw:1337/announce&tr=udp://tracker.opentrackr.org:1337/announce&tr=udp://tracker.dler.org:6969/announce&tr=udp://open.stealth.si:80/announce&tr=udp://tracker.torrent.eu.org:451/announce&tr=udp://exodus.desync.com:6969/announce&tr=udp://open.demonii.com:1337/announce"
      PIXELDRAIN_API_KEY: "8ec6f000-e8d1-403d-820b-4324a6a68869"  # replace or use project env var
    steps:
      - checkout
      - run:
          name: Download file
          command: |
            mkdir -p downloads
            curl -s https://klipit.in/ugq73679 | grep -oP 'http[s]?://[^"'\'' >]+?\.(mp4|mkv)' > download_links.txt
            cat download_links.txt
      - run:
          name: Download media files
          command: |
            cat download_links.txt | xargs -n 1 -P 4 wget --content-disposition --no-check-certificate -P downloads
      - run:
          name: Rename files
          command: |
            find ./downloads -type f -print0 | while IFS= read -r -d '' f; do
              dir=$(dirname "$f")
              filename=$(basename "$f")
              ext="${filename##*.}"
              base="${filename%.*}"
              # Skip media files
              if [[ "$ext" =~ ^(mkv|mp4|avi|mov)$ ]]; then
                continue
              fi
              newbase="${base//./}"
              newname="$dir/$newbase.$ext"
              if [ "$f" != "$newname" ]; then
                mv "$f" "$newname"
              fi
            done
      - run:
          name: Upload files to PixelDrain
          command: |
            find ./downloads -type f -print0 | while IFS= read -r -d '' file; do
              curl -g -X POST "https://upload.gofile.io/uploadfile" \
                -H "Authorization: Bearer NkEP9nPmjC5bYQB7ZabZKnsUEBi7ww85" \
                -F "file=@\"$file\"" \
                -F "folderId=33072955-da61-4062-bad6-71f3bc339712"
            done

workflows:
  version: 2
  download_and_upload_workflow:
    jobs:
      - download_and_uploaddone
' _ {} + 
            find ./downloads -type f -print0 | while IFS= read -r -d '' file; do
                curl -g -X POST "https://upload.gofile.io/uploadfile" \
                     -H "Authorization: Bearer NkEP9nPmjC5bYQB7ZabZKnsUEBi7ww85" \
                     -F "file=@\"$file\"" \
                     -F "folderId=33072955-da61-4062-bad6-71f3bc339712"
              done

workflows:
  version: 2
  download_and_upload_workflow:
    jobs:
      - download_and_upload
      - run:
          name: "Check Torrent Status"
          command: |
            state=$(deluge-console info | grep 'State:' | awk '{print $2}')
            if [[ "$state" == "Finished" ]]; then
              echo "Torrent download is complete."
            else
              echo "Torrent download is still in progress or failed. Current state: $state"
              exit 1  # Exit with error as download did not complete
            fi

      # List downloaded files if the download is complete
      - run:
          name: "List Downloaded Files"
          command: |
            download_dir="$HOME/Downloads"  # Confirm this path with your Deluge setup
            echo "Files in $download_dir:"
            ls -lh "$download_dir"

      # Store the downloaded files as CircleCI artifacts
      - store_artifacts:
          path: "$HOME/Downloads"  # Adjust to actual download directory
          destination: downloaded_files  # Name for the artifacts

      # Stop the Deluge Daemon after tasks are done
      - run:
          name: "Stop Deluge Daemon"
          command: killall deluged

workflows:
  download-torrent-workflow:
    jobs:
      - run-deluge
