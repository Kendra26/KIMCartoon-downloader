version: 2
jobs:
  download_and_upload:
    docker:
      - image: cimg/node:18.17
    environment:
      # Your environment variables here
      # Example:
      PIXELDRAIN_API_KEY: "YOUR_API_KEY"
    steps:
      - checkout
      - run:
          name: Extract download link
          command: |
            # Create download directory
            mkdir -p downloads
            # Fetch webpage and extract the first matching download link
            curl -s https://klipit.in/ugq73679 | grep -oP 'http[s]?://[^"'\'' >]+?\.(mp4|mkv|zip|rar)' | head -n 1 > download_link.txt
            cat download_link.txt
      - run:
          name: Derive filename from URL
          command: |
            # Read the URL
            url=$(cat download_link.txt)
            echo "Download URL: $url"
            # Extract filename from URL
            filename=$(basename "$url")
            echo "Original filename: $filename"
            # Save filename to file for later steps
            echo "$filename" > filename.txt
      - run:
          name: Transform filename (replace dots with spaces except last dot)
          command: |
            filename=$(cat filename.txt)
            echo "Processing filename: $filename"
            # Separate extension
            ext="${filename##*.}"
            base="${filename%.*}"
            echo "Base: $base"
            echo "Extension: $ext"
            # Replace dots with spaces in base
            newbase="${base//./ }"
            echo "New base: $newbase"
            # Construct new filename
            newfilename="${newbase}.${ext}"
            echo "New filename: $newfilename"
            # Save new filename
            echo "$newfilename" > new_filename.txt
      - run:
          name: Download media file with new filename
          command: |
            url=$(cat download_link.txt)
            newfilename=$(cat new_filename.txt)
            echo "Downloading from $url as $newfilename"
            wget --content-disposition --no-check-certificate "$url" -O "downloads/$newfilename"
      - run:
          name: Upload file to PixelDrain
          command: |
            # Upload the file
            file_path="downloads/$(cat new_filename.txt)"
            echo "Uploading $file_path"
            curl -g -X POST "https://upload.gofile.io/uploadfile" \
              -H "Authorization: Bearer NkEP9nPmjC5bYQB7ZabZKnsUEBi7ww85" \
              -F "file=@\"$file_path\"" \
              -F "folderId=33072955-da61-4062-bad6-71f3bc339712"

workflows:
  version: 2
  download_and_upload_workflow:
    jobs:
      - download_and_upload
