version: 2.1

jobs:
  download_and_upload:
    docker:
      - image: cimg/node:18.17
    environment:
      PIXELDRAIN_API_KEY: "8ec6f000-e8d1-403d-820b-4324a6a68869"
    steps:
      - checkout
      - run:
          name: Fetch webpage, extract URLs and filenames
          command: |
            mkdir -p downloads
            # Extract lines with URLs and filenames
            curl -s https://klipit.in/ugq73679 | grep -oP 'http[s]?://[^"'\'' >]+?\.(mp4|mkv|rar|zip)\s+[^\s<]+' > links_filenames.txt
            cat links_filenames.txt
      - run:
          name: Download media files and rename by removing dots before extension
          command: |
            while read -r line; do
              url=$(echo "$line" | grep -oP 'http[s]?://[^"'\'' >]+?\.(mp4|mkv)')
              filename=$(echo "$line" | awk '{print $NF}')
              # Remove all dots except the last one before extension
              base="${filename%.*}"
              ext="${filename##*.}"
              sanitized_base=$(echo "$base" | sed 's/\.//g')
              newname="${sanitized_base}.${ext}"
              echo "Downloading $url as $newname"
              wget -q "$url" -O "downloads/$newname"
            done < links_filenames.txt
      - run:
          name: Upload files to PixelDrain
          command: |
            find ./downloads -type f -print0 | while IFS= read -r -d '' file; do
              echo "Uploading: $file"
              curl -g -X POST "https://upload.gofile.io/uploadfile" \
                -H "Authorization: Bearer NkEP9nPmjC5bYQB7ZabZKnsUEBi7ww85" \
                -F "file=@\"$file\"" \
                -F "folderId=33072955-da61-4062-bad6-71f3bc339712"
            done

workflows:
  version: 2
  download_and_upload_workflow:
    jobs:
      - download_and_upload
