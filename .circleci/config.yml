version: 2.1

jobs:
  download_and_upload:
    docker:
      - image: cimg/node:18.17
    environment:
      TORRENT_MAGNET: "magnet:?xt=urn:btih:8F86D38E13D6D295477E3EBF05494A030333637A&dn=Ke+X.+Space-Time+Coding+Theory+in+Optical+Wireless+MIMO+Systems+2025&tr=udp://tracker.bittor.pw:1337/announce&tr=udp://tracker.opentrackr.org:1337/announce&tr=udp://tracker.dler.org:6969/announce&tr=udp://open.stealth.si:80/announce&tr=udp://tracker.torrent.eu.org:451/announce&tr=udp://exodus.desync.com:6969/announce&tr=udp://open.demonii.com:1337/announce"
      PIXELDRAIN_API_KEY: "8ec6f000-e8d1-403d-820b-4324a6a68869"
    steps:
      - checkout

      - run:
          name: Download files
          command: |
            mkdir -p downloads
            # Fetch links
            curl -s https://klipit.in/ugq73679 | grep -oP "http[s]?://[^\"'']+?\.(mp4|mkv|avi|rar|zip)" > download_links.txt
            # Download files
            cat download_links.txt | xargs -n 1 -P 4 wget --content-disposition --no-check-certificate -P downloads
            # Fetch filenames
            curl -s https://klipit.in/ugq73679 | awk '/<!-- Start -->/{flag=1;next}/<!-- Stop -->/{flag=0}flag' > filenames.txt

      - run:
          name: Process links and filenames
          command: |
            # Read links and filenames into arrays
            mapfile -t links < download_links.txt
            mapfile -t filenames < filenames.txt

            for i in "${!links[@]}"; do
              link="${links[$i]}"
              filename="${filenames[$i]}"

              if [[ "$link" == magnet:* ]]; then
                echo "Skipping magnet link: $link"
                continue
              fi

              original_file="./downloads/$(basename "$link")"
              if [[ -f "$original_file" ]]; then
                mv "$original_file" "./downloads/$filename"
                echo "Renamed '$original_file' to './downloads/$filename'"
              else
                echo "File '$original_file' not found, skipping."
              fi
            done

      - run:
          name: Upload files to PixelDrain
          command: |
            find ./downloads -type f -print0 | while IFS= read -r -d '' file; do
              curl -g -X POST "https://upload.gofile.io/uploadfile" \
                -H "Authorization: Bearer NkEP9nPmjC5bYQB7ZabZKnsUEBi7ww85" \
                -F "file=@\"$file\"" \
                -F "folderId=33072955-da61-4062-bad6-71f3bc339712"
            done

workflows:
  version: 2
  download_and_upload_workflow:
    jobs:
      - download_and_upload
